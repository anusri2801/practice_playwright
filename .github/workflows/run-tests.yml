name: Playwright Test Core

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      tags:
        required: true
        type: string

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      env:
        TEST_ENV: ${{ inputs.environment }}
        CI: true
      run: |
        npx playwright test --grep "@${{ inputs.tags }}"

    - name: Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-${{ inputs.environment }}-${{ inputs.tags }}
        path: playwright-report/
        retention-days: 30